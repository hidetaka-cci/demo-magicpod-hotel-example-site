# Shift-left quality: format, lint, unit tests, and webpack build (node orb).
# Release deploy (staging → MagicPod → production): deploy.yml
#
# unit-tests: 100% coverage + full PBT (build gate, 1 node)
# unit-test-smarter: Smarter Testing — Dynamic Test Splitting + TIA selection (non-blocking)
# unit-test-analysis: TIA impact map update on main only (non-blocking)

version: 2.1

orbs:
  node: circleci/node@7.2.1

executors:
  node-pnpm:
    docker:
      - image: cimg/node:24.12
    resource_class: medium

commands:
  install-pnpm-deps:
    description: Install pnpm and project dependencies for custom jobs.
    steps:
      - node/install-pnpm:
          version: "11.0.0"
      - node/install-packages:
          pkg-manager: pnpm
          include-branch-in-cache-key: false

jobs:
  unit-test-smarter:
    executor: node-pnpm
    parallelism: 4
    steps:
      - checkout
      - install-pnpm-deps
      - run:
          name: Run unit tests (Smarter Testing)
          command: circleci run testsuite "unit tests" --analyze-tests=none
          environment:
            PBT_NUM_RUNS: "1200000"
      - store_test_results:
          path: test-reports

  unit-test-analysis:
    executor: node-pnpm
    steps:
      - checkout
      - install-pnpm-deps
      - run:
          name: Update test impact data (TIA analysis)
          command: circleci run testsuite "unit tests" --select-tests=none --analyze-tests=impacted
          environment:
            PBT_NUM_RUNS: "100"

workflows:
  build-test-lint:
    jobs:
      - node/run:
          name: fmt-check
          executor: node-pnpm
          pkg-manager: pnpm
          pnpm-run: fmt:check
          include-branch-in-cache-key: false
          setup:
            - node/install-pnpm:
                version: "11.0.0"
      - node/run:
          name: lint
          executor: node-pnpm
          pkg-manager: pnpm
          pnpm-run: lint
          include-branch-in-cache-key: false
          setup:
            - node/install-pnpm:
                version: "11.0.0"
      - node/run:
          name: unit-tests
          executor: node-pnpm
          pkg-manager: pnpm
          pnpm-run: test:unit:ci
          include-branch-in-cache-key: false
          artifacts-path: coverage
          setup:
            - node/install-pnpm:
                version: "11.0.0"
      - unit-test-smarter
      - unit-test-analysis:
          filters:
            branches:
              only: main
      - node/run:
          name: build
          executor: node-pnpm
          pkg-manager: pnpm
          pnpm-run: build
          include-branch-in-cache-key: false
          artifacts-path: dist
          setup:
            - node/install-pnpm:
                version: "11.0.0"
          requires:
            - fmt-check
            - lint
            - unit-tests
