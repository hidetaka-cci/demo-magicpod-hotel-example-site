# MagicPod × CircleCI: build → staging → E2E gate → production (自動ゲート、付録A 既定)
#
# 本番前に人手承認を挟む A-1 パターン: config.with-approval.yml を参照。
#
# Context: aws-oidc
#   AWS_ACCOUNT_ID, AWS_REGION, AWS_ROLE_ARN
#
# Project environment variables:
#   S3_STAGING_BUCKET_NAME, S3_PRODUCTION_BUCKET_NAME  (bucket name, not ARN)
#   MAGICPOD_API_TOKEN, MAGICPOD_ORGANIZATION, MAGICPOD_PROJECT, MAGICPOD_SETTING_NUMBER
#
# MagicPod browser E2E: https://support.magic-pod.com/hc/ja/articles/4408910495897
# E2E 結果は scripts/magicpod_to_junit.py で JUnit XML に変換し Test Insights へ取り込む。
# OIDC: attach aws-oidc context to deploy jobs so CIRCLE_OIDC_TOKEN is available.
#
# Deploy markers: deploy-staging / deploy-production log releases to CircleCI Deploys
# (Project Settings → Deploys). Environments: staging, production. Component: hotel-example-site.

version: 2.1

orbs:
  node: circleci/node@7.2.1
  aws-cli: circleci/aws-cli@5.4.1
  aws-s3: circleci/aws-s3@5.0.0

commands:
  prepare-publish-artifact:
    description: >
      Build once, ship the same tree to staging and production.
      File selection matches .github/workflows/static.yml (Upload artifact).
    steps:
      - run:
          name: Prepare publish directory
          command: |
            mkdir -p publish
            cp -r index.html ja en-US data dist publish/

  assume-aws-role:
    description: Assume an AWS IAM role via CircleCI OIDC (aws-oidc context).
    steps:
      - aws-cli/setup:
          role_arn: ${AWS_ROLE_ARN}
          region: ${AWS_REGION}
          role_session_name: ${CIRCLE_JOB}-${CIRCLE_BUILD_NUM}
          session_duration: "3600"

  sync-publish-to-s3:
    description: Sync the publish workspace artifact to an S3 static website bucket.
    parameters:
      bucket_name:
        type: string
    steps:
      - aws-s3/sync:
          from: publish
          to: s3://<< parameters.bucket_name >>/
          arguments: "--delete --exact-timestamps"

  plan-deploy-marker:
    description: Plan a deploy marker in CircleCI Deploys UI (pending).
    parameters:
      deploy_name:
        type: string
      environment_name:
        type: string
    steps:
      - run:
          name: Plan deployment
          command: |
            circleci run release plan << parameters.deploy_name >> \
              --environment-name=<< parameters.environment_name >> \
              --component-name=hotel-example-site \
              --target-version="1.0.${CIRCLE_BUILD_NUM}-${CIRCLE_SHA1:0:7}"

  mark-deploy-running:
    description: Mark planned deploy as running after S3 sync.
    parameters:
      deploy_name:
        type: string
    steps:
      - run:
          name: Update planned deployment to running
          command: circleci run release update << parameters.deploy_name >> --status=running

  finalize-deploy-marker:
    description: Mark deploy SUCCESS on job success, FAILED on job failure.
    parameters:
      deploy_name:
        type: string
    steps:
      - run:
          name: Update planned release to SUCCESS
          command: circleci run release update << parameters.deploy_name >> --status=SUCCESS
          when: on_success
      - run:
          name: Update planned release to FAILED
          command: circleci run release update << parameters.deploy_name >> --status=FAILED
          when: on_fail

jobs:
  build:
    executor:
      name: node/default
      tag: "24.12"
      resource_class: medium
    steps:
      - checkout
      - node/install-pnpm:
          version: "11.0.0"
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Build static site
          command: pnpm run build
      - prepare-publish-artifact
      - persist_to_workspace:
          root: .
          paths:
            - publish

  deploy-staging:
    executor: aws-cli/default
    steps:
      - attach_workspace:
          at: .
      - plan-deploy-marker:
          deploy_name: staging
          environment_name: staging
      - assume-aws-role
      - sync-publish-to-s3:
          bucket_name: ${S3_STAGING_BUCKET_NAME}
      - mark-deploy-running:
          deploy_name: staging
      - finalize-deploy-marker:
          deploy_name: staging

  e2e-magicpod:
    executor: aws-cli/default
    resource_class: small
    steps:
      - checkout
      - run:
          name: Run MagicPod browser tests and collect results
          command: ./scripts/run-magicpod-e2e.sh
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results

  deploy-production:
    executor: aws-cli/default
    steps:
      - attach_workspace:
          at: .
      - plan-deploy-marker:
          deploy_name: production
          environment_name: production
      - assume-aws-role
      - sync-publish-to-s3:
          bucket_name: ${S3_PRODUCTION_BUCKET_NAME}
      - mark-deploy-running:
          deploy_name: production
      - finalize-deploy-marker:
          deploy_name: production

workflows:
  release:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
      # TEMP: deploy-staging をスキップ（CI 調査中）
      # - deploy-staging:
      #     requires:
      #       - build
      #     context:
      #       - aws-oidc
      #     filters:
      #       branches:
      #         only:
      #           - main
      - e2e-magicpod:
          requires:
            - build
          filters:
            branches:
              only:
                - main
      - deploy-production:
          requires:
            - e2e-magicpod
          context:
            - aws-oidc
          filters:
            branches:
              only:
                - main
